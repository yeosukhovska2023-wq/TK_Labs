<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petworld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="#" class="logo">
                <img src="assets/Logo.svg" alt="">
<span>PETWORLD</span>
            </a>
            <nav class="nav">
                <a href="#" class="nav__link">Sign Up</a>
                <a href="#" class="btn btn--blue">Log in</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container hero__inner">
                <div class="hero__text">
                    <h1>Pet Store<br>&amp; Beyond</h1>
                    <p>This is a sample landing page, created with Figma and Anima. No coding involved.</p>
                    <a href="https://itcollege.lviv.ua/" class="btn btn--yellow">Get Started</a>
                </div>
                <img src="assets/Image.png" alt="Two dogs in colorful jackets" class="hero__img">
            </div>
        </section>

        <section class="video">
            <div class="video__box">
                <img src="assets/Video.png" alt="Video preview">
                <span class="video__play"></span>
            </div>
        </section>

        <section class="logos">
            <img src="assets/Nestle.svg" alt="Nestle">
            <img src="assets/Apple.svg" alt="Apple">
            <img src="assets/Beco.svg" alt="Beco">
            <img src="assets/Amazon.svg" alt="Amazon">
            <img src="assets/Google.svg" alt="Google">
            <img src="assets/Walmart.svg" alt="Walmart">
        </section>
    </main>
</body>
</html>
