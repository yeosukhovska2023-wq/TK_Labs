<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Підписка</title>
</head>
<body>
    <form action="." method="post" enctype="multipart/form-data">
            <h2>Персональні дані</h2>
            <fieldset>
                <legend>Підписки для отримання оновлень блогу</legend>
                <p><label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Введіть ваш email">
        
                </p>
                <p><label for="form">Форма для зв'язку:</label>
                    <textarea id="form" name="form"></textarea>
                </p>
            <p><input type="submit" id="submit" name="submit" value="Відправити">
                </fieldset>
                <label for="submit"></label></p>
                <input type="checkbox" id="verify" name="verify">
                <label for="verify">Згода на отримання розсилки</label>
                <p></p>
                <p><input type="submit" id="submit" name="submit" value="Підписатися">
                <label for="submit"></label></p>
</body>
</html>
