<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <form action="." method="post" enctype="multipart/form-data">
            <h2>Персональні дані</h2>
            <fieldset>
                <legend>Введіть дані</legend>
                <p><label for="name">Ім'я:</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p><label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p><label for="form">Форма для зв'язку:</label>
                    <textarea id="form" name="form"></textarea>
                </p>
            </fieldset>
            <p><input type="submit" id="submit" name="submit" value="Відправити">
                <label for="submit"></label></p>
</form>
</body>
</html>
