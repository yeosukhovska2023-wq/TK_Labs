<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4</title>
</head>

<body>
    <header>
        <h1>Студентська форма</h1>
    </header>
    <main>
        <section>
           <form action="." method="post" enctype="multipart/form-data"></form>
            <h2>Персональні дані</h2>
            <fieldset>
                <legend>Основна інформація</legend>
                <p><label for="name">Ім'я:</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p><label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p><label for="password">Пароль:</label>
                    <input type="password" id="password" name="password">
                </p>
                <p><label for="age">Вік:</label>
                    <input type="number" id="age" name="age" min="0" max="100">
                </p>
                <p><label for="dateOfBirth">Дата народження:</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth">
                </p>

                <p><label for="name">Гендер</label>
                <p></p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Чоловік</label>
                <p></p>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Жінка</label>
                <p></p>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Інше</label>
                </p>

                <p><label for="name">Мови, які ви знаєте:</label>
                <p></p>
                <input type="checkbox" id="english" name="languages" value="english">
                <label for="english">Англійська</label>
                <p></p>
                <input type="checkbox" id="spanish" name="languages" value="spanish">
                <label for="spanish">Іспанська</label>
                <p></p>
                <input type="checkbox" id="french" name="languages" value="french">
                <label for="french">Французька</label>
                </p>

                <p><label for="name">Країна:</label>
                <p></p>
                <input type="checkbox" id="ukraine" name="country" value="ukraine">
                <label for="ukraine">Україна</label>
                <p></p>
                <input type="checkbox" id="usa" name="country" value="usa">
                <label for="usa">США</label>
                <p></p>
                <input type="checkbox" id="canada" name="country" value="canada">
                <label for="canada">Канада</label>
                </p></fieldset>
                <h2>Предмети в коледжі</h2>
                <p><label for="name">Виберіть предмети:</label>
                <p></p>
                <select multiple id="math" name="subjects">
                    <option value="math">Математика</option>
                    <option value="cs">Комп'ютерні науки</option>
                    <option value="physics">Фізика</option>
                    <option value="chemistry">Хімія</option>
                    <option value="english">Англійська</option>
                </select>
                <p><label for="name">Оцініть свій інтерес в Комп'ютерних науках:</label>
                <p></p>
                <input type="range" id="range" name="range" value="0" min="1" max="10">
                </p>
                <h2>Навички</h2>
                <p>Опишіть свої навички <input type="textarea" id="skills" name="skills">
                <label for="skills"></label></p>

                <p>Завантажити резюме <input type="file" id="file" name="file">
                <label for="file"></label></p>
<p><input type="color" id="color" name="color">
                <label for="color">Виберіть бажаний колір</label></p>
<p><input type="time" id="time" name="time">
                <label for="time">Виберіть бажаний час</label></p>
<p><input type="submit" id="submit" name="submit" value="Відправити">
                <label for="submit"></label></p>
</form>
        </section>
    </main>
</body>
</html>
